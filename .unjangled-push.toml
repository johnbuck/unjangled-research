# Unjangled Push policy for this repository.
#
# The remote is public and require_cut is set for it, so the [cut]
# block below is mandatory: the history has exactly one root.
#
# Exemptions cover vendored English word lists, plus two narrow
# entries at the end: a publisher name in a source-scoring table and
# a letter run inside embedded font base64. There is one entry per
# file and term ID that actually hits there, each pinned to the
# file's current blob so an edited file is re-evaluated.
#
# This file loosens nothing at the public remote until its blob is
# approved there with "unjangled-push policy approve origin".

