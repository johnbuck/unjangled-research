<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Theme QA fixture — injected live markup</title>
<style>
:root{--rf-surface:#FFFFFF;--rf-ink:#262626;--rf-type:"Lato",sans-serif}
body{margin:0;background:var(--rf-surface);color:var(--rf-ink);font-family:var(--rf-type)}
</style>
</head>
<body><main><p>Sample fixture content.</p>
<button onclick=x>Click</button>
<img ONERROR = x src=y alt="">
<img onerror="a&gt;b" src=z alt="">
<a href="javascript:alert(1)">quiet link</a>
<a HREF="  JAVa&#x09;script:alert(2)">entity and case link</a>
<a href='jav&#x61;script:x'>single-quoted entity link</a>
<iframe src="javascript:alert(3)"></iframe>
<img src=//cdn.example.com/pixel.png alt="">
<p title="onerror=x">The onerror= here sits in a quoted attribute value, not a handler.</p>
<p>Escaped text such as &lt;img onerror=x&gt; is not a tag.</p>
<!-- <script>var x=1;</script> inside a comment is inert -->
</main></body></html>
